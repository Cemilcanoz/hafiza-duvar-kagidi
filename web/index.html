<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#153cdb"><title>Hafıza Duvar Kâğıdı · CemoOS</title><link rel="stylesheet" href="/style.css"></head>
<body data-mode="graph">
<canvas id="scene" tabindex="0" aria-label="CemoOS bağlantı grafı. Sürükleyerek gez, tekerlekle yakınlaş, bir not seç. Klavyeyle not aramak için arama alanını kullan."></canvas>
<section class="telemetry" aria-label="Graf bilgileri"><div><strong id="node-count">—</strong><span>NOT</span></div><span class="slash">/</span><div><strong id="edge-count">—</strong><span>BAĞLANTI</span></div><p id="status" role="status">Metadata bekleniyor…</p></section>
<div id="tooltip" role="tooltip" hidden><strong></strong><span></span></div>
<section id="selection" class="dossier" aria-label="Seçili not" hidden><div class="dossier-top"><span>ODAK NOKTASI</span><button id="close-selection" aria-label="Not panelini kapat">×</button></div><h2 id="selected-label"></h2><p id="selected-path"></p><button id="open-note" class="primary">Obsidian’da aç <span>↗</span></button><div class="node-appearance"><label for="node-color">Bu notun rengi</label><div id="node-swatches" class="swatches"></div><div class="color-row"><input id="node-color" type="color" value="#f5efd9" aria-label="Seçili notun özel rengi"><button id="reset-node-color">Klasör rengini kullan</button></div></div><div id="connections"></div></section>
<section id="appearance-panel" class="appearance-panel" aria-label="Görünüm ayarları" hidden><div class="dossier-top"><span>GÖRÜNÜM</span><button id="close-appearance" aria-label="Görünüm ayarlarını kapat">×</button></div><label for="background-color">Arka plan</label><div id="background-swatches" class="swatches"></div><div class="color-row"><input id="background-color" type="color" value="#153cdb"><output id="background-value">#153cdb</output></div><label for="folder-select">Klasöre göre renk</label><select id="folder-select" aria-label="Renk verilecek klasör"></select><div id="folder-swatches" class="swatches"></div><div class="color-row"><input id="folder-color" type="color" value="#f5efd9" aria-label="Klasör rengi"><button id="reset-folder-color">Klasör rengini temizle</button></div><p class="appearance-hint">Tek bir notun rengini değiştirmek için graf üzerinde o notu seç. Not rengi, klasör renginden önce gelir.</p><label for="motion-select">Hareket</label><select id="motion-select"><option value="organic">Organik nefes</option><option value="flow">Bağlantılarda akış</option><option value="still">Durağan</option></select><label for="style-select">Görsel doku</label><select id="style-select"><option value="glow">Işıklı çekirdek</option><option value="ink">İnce mürekkep</option></select><p id="appearance-status" role="status">Ayarlar bu cihazda saklanır.</p></section>
<aside id="controls" aria-label="Graf araçları"><div class="search-wrap"><label for="search">BİR DÜŞÜNCE BUL</label><div class="search-field"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Notlarda ara…" autocomplete="off" aria-controls="search-results" aria-expanded="false"><kbd>/</kbd><button id="explore" title="Arama ve klavye için tarayıcıda aç">Keşif penceresi ↗</button></div><div id="search-results" role="listbox" aria-label="Arama sonuçları" hidden></div></div><div class="actions"><button id="zoom-out" aria-label="Uzaklaş">−</button><button id="zoom-in" aria-label="Yakınlaş">+</button><button id="reset-view" title="Görünümü sıfırla (0)">Sığdır</button><button id="toggle">Resme geç ↔</button><label class="file">Resim seç<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="appearance-toggle" aria-expanded="false" aria-controls="appearance-panel">Görünüm</button><button id="live" aria-pressed="false" title="Sakin ışık akışını aç veya kapat">Canlı <span class="live-dot"></span></button></div><p id="error" role="alert"></p></aside>
<footer class="legend"><span class="legend-line"></span><span>SÜRÜKLE · YAKINLAŞ · KEŞFET</span><span class="shortcut">RESİM / GRAF <b id="shortcut">Ctrl + Alt + G</b></span></footer>
<script src="/scene.js" defer></script></body></html>
